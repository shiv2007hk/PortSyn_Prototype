<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#F4F8FB" />
    <meta
      name="description"
      content="PortSync — an intelligent port operations platform synchronising ships, docks, cranes, fleets, containers and dispatch through one connected digital twin."
    />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=Instrument+Sans:wght@400;500;600;700&family=Inter:wght@400;450;500;600;700&display=swap"
      rel="stylesheet"
    />
    <title>PortSync · One Port. Every Resource. Intelligent Operations.</title>
    <script>
      (function() {
        try {
          var saved = localStorage.getItem("portsync_theme") || localStorage.getItem("portsync_landing_theme");
          var theme = saved === "light" || saved === "dark"
            ? saved
            : (window.matchMedia && window.matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light");
          document.documentElement.classList.add(theme);
          document.documentElement.classList.add("theme-" + theme);
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>

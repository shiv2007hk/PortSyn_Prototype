# Render Blueprint — one-click deploy of the full PortSync stack:
#   portsync-db   Render Postgres (free plan, expires 30 days after creation)
#   portsync-api  FastAPI backend (native Python runtime)
#   portsync-web  Vite SPA (static site)
#
# Apply from the Render Dashboard: New + → Blueprint → connect this repo.
# Render derives each service's public URL from its name. If a name is already
# taken Render appends a random suffix — in that case update CORS_ORIGINS,
# VITE_API_URL and VITE_WS_URL (here or in the dashboard) and redeploy.

services:
  # --- Backend API --------------------------------------------------------
  - type: web
    name: portsync-api
    runtime: python
    plan: free
    branch: main
    rootDir: backend
    buildCommand: pip install -r requirements.txt -r requirements-postgres.txt
    startCommand: alembic upgrade head && uvicorn app.main:app --host 0.0.0.0 --port $PORT --proxy-headers
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      # Pin the Python runtime to the version the Docker image uses.
      - key: PYTHON_VERSION
        value: 3.12.8
      - key: ENVIRONMENT
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: portsync-db
          property: connectionString
      # Must be the exact origin of the deployed frontend, no trailing slash.
      - key: CORS_ORIGINS
        value: https://portsync-web.onrender.com
      - key: SIM_ENABLED
        value: "true"
      - key: SIM_TICK_SECONDS
        value: "4"
      - key: SIM_SEED
        value: "20261"
      # Optional LLM assistant (backend-only secret). Leave unset to keep the
      # grounded rules engine; to enable, add in the dashboard:
      #   LLM_API_KEY   (required to switch to model-backed replies)
      #   LLM_BASE_URL  e.g. https://api.groq.com/openai/v1
      #   LLM_MODEL     e.g. openai/gpt-oss-120b

  # --- Frontend SPA -------------------------------------------------------
  - type: web
    name: portsync-web
    runtime: static
    branch: main
    rootDir: frontend
    buildCommand: npm ci && npm run build
    staticPublishPath: dist
    routes:
      # BrowserRouter history fallback for deep links (e.g. /analytics).
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      # VITE_* vars are inlined at build time. VITE_API_URL is the origin
      # only — the client appends /api paths and /ws sockets itself.
      - key: VITE_API_URL
        value: https://portsync-api.onrender.com
      - key: VITE_WS_URL
        value: wss://portsync-api.onrender.com/ws/operations

databases:
  - name: portsync-db
    databaseName: portsync
    user: portsync
    plan: free # Free Postgres expires 30 days after creation; upgrade to keep data
    postgresMajorVersion: "16" # matches docker-compose.yml; cannot change later
